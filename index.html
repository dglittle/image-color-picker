<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Color Picker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: #222; background: #fafafa; }
  header { position: sticky; top: 0; z-index: 2; background: #fff; border-bottom: 1px solid #ddd; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; }
  .read { display: flex; align-items: center; gap: 8px; min-width: 260px; font-variant-numeric: tabular-nums; }
  .read b { font-weight: 600; width: 58px; }
  .sw { width: 26px; height: 26px; border: 1px solid #888; border-radius: 3px; flex: none;
        background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 10px 10px; position: relative; }
  .sw i { position: absolute; inset: 0; }
  /* fixed widths so the header never changes size (and shifts the image) as values change */
  code { font: 15px ui-monospace, Menlo, Consolas, monospace; display: inline-block; min-width: 26ch; white-space: nowrap; }
  .xy { color: #777; font: 13px ui-monospace, Menlo, Consolas, monospace; display: inline-block; min-width: 25ch; white-space: pre; }
  button, .btn { font: inherit; font-size: 13px; padding: 3px 9px; border: 1px solid #aaa; border-radius: 4px; background: #f4f4f4; cursor: pointer; }
  .tools { display: flex; gap: 6px; align-items: center; margin-left: auto; }
  #zl { min-width: 46px; text-align: center; font-size: 13px; }
  main { padding: 12px; }
  #drop { border: 2px dashed #bbb; border-radius: 8px; padding: 40px 16px; text-align: center; color: #666; }
  #drop.over, main.over #wrap { outline: 3px dashed #4a8; }
  #wrap { position: relative; display: inline-block; line-height: 0; }
  #cv { image-rendering: pixelated; image-rendering: crisp-edges; cursor: crosshair; display: block;
        background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 16px 16px; }
  #mark { position: absolute; pointer-events: none; outline: 1px solid #000; box-shadow: 0 0 0 1px #fff, inset 0 0 0 1px #fff; display: none; }
  input[type=file] { display: none; }
</style>
</head>
<body>
<header>
  <div class="read"><b>Hover</b><span class="sw"><i id="hsw"></i></span><code id="hv">–</code><span class="xy" id="hxy"></span></div>
  <div class="read"><b>Clicked</b><span class="sw"><i id="csw"></i></span><code id="cv2">–</code><span class="xy" id="cxy"></span><button id="copy" style="visibility: hidden">Copy</button></div>
  <div class="tools">
    <label class="btn">Open…<input type="file" id="file" accept="image/*"></label>
    <button id="zout" title="Zoom out">−</button><span id="zl"></span><button id="zin" title="Zoom in">+</button><button id="fit">Fit</button>
  </div>
</header>
<main id="main">
  <div id="drop">Paste an image (Ctrl/Cmd+V), drop one here, or <label class="btn">open a file<input type="file" id="file2" accept="image/*"></label>.<br><br>
    Hover to read a pixel; click or tap to keep it.</div>
  <div id="wrap" hidden><canvas id="cv"></canvas><div id="mark"></div></div>
</main>
<script>
const $ = id => document.getElementById(id)
const cv = $('cv'), wrap = $('wrap'), mark = $('mark')
let W = 0, H = 0, data = null, zoom = 1, clicked = null

// Decode without colour management or premultiplication, so we get the file's
// stored values. Fall back to <img> where those options aren't supported.
async function decode(blob) {
  try {
    return await createImageBitmap(blob, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' })
  } catch (e) {
    const img = new Image()
    img.src = URL.createObjectURL(blob)
    await img.decode()
    return img
  }
}

async function load(blob) {
  if (!blob || !/^image\//.test(blob.type)) return
  let bmp
  try { bmp = await decode(blob) } catch (e) { alert('Could not read that image.'); return }
  W = bmp.width || bmp.naturalWidth; H = bmp.height || bmp.naturalHeight
  // Canvas at the image's natural size: one canvas pixel per image pixel.
  cv.width = W; cv.height = H
  const ctx = cv.getContext('2d', { willReadFrequently: true, colorSpace: 'srgb' })
  ctx.imageSmoothingEnabled = false
  ctx.clearRect(0, 0, W, H)
  ctx.drawImage(bmp, 0, 0)
  data = ctx.getImageData(0, 0, W, H, { colorSpace: 'srgb' }).data
  if (bmp.close) bmp.close()
  $('drop').hidden = true; wrap.hidden = false
  clicked = null; show('c', null); show('h', null)
  fit()
}

function px(x, y) {
  const i = (y * W + x) * 4
  return { x, y, r: data[i], g: data[i + 1], b: data[i + 2], a: data[i + 3] }
}
const fmt = p => p.a === 255 ? `rgb(${p.r}, ${p.g}, ${p.b})` : `rgba(${p.r}, ${p.g}, ${p.b}, ${+(p.a / 255).toFixed(3)})`
const hex = p => '#' + [p.r, p.g, p.b].map(v => v.toString(16).padStart(2, '0')).join('')

function show(k, p) {
  const v = $(k === 'h' ? 'hv' : 'cv2'), sw = $(k + 'sw'), xy = $(k + 'xy')
  v.textContent = p ? fmt(p) : '–'
  sw.style.background = p ? fmt(p) : ''
  xy.textContent = p ? `${hex(p)}  x ${p.x}, y ${p.y}` : ''
  if (k === 'c') { $('copy').style.visibility = p ? '' : 'hidden'; placeMark() }
}

// Map a pointer position to image-pixel coordinates using the canvas's
// on-screen box, so CSS zoom and devicePixelRatio don't affect which pixel is read.
function at(e) {
  if (!data) return null
  const r = cv.getBoundingClientRect()
  const x = Math.floor((e.clientX - r.left) / r.width * W)
  const y = Math.floor((e.clientY - r.top) / r.height * H)
  if (x < 0 || y < 0 || x >= W || y >= H) return null
  return px(x, y)
}

cv.addEventListener('pointermove', e => show('h', at(e)))
cv.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') show('h', null) })
// 'click' coordinates are rounded to whole CSS pixels in some browsers, which can
// land on the neighbouring image pixel at low zoom; use the pointerdown position instead.
let down = null
cv.addEventListener('pointerdown', e => down = e)
cv.addEventListener('click', e => { const p = at(down || e); if (p) { clicked = p; show('c', p); show('h', p) } })

function placeMark() {
  if (!clicked) { mark.style.display = 'none'; return }
  const s = cv.clientWidth / W
  Object.assign(mark.style, { display: 'block', left: clicked.x * s + 'px', top: clicked.y * s + 'px',
    width: Math.max(s, 3) + 'px', height: Math.max(s, 3) + 'px' })
}

function setZoom(z) {
  zoom = Math.min(64, Math.max(0.05, z))
  cv.style.width = W * zoom + 'px'; cv.style.height = H * zoom + 'px'
  $('zl').textContent = Math.round(zoom * 100) + '%'
  placeMark()
}
// Largest whole-number zoom that fits the window (or a fractional shrink for big images).
function fit() {
  const aw = document.documentElement.clientWidth - 24
  const ah = window.innerHeight - document.querySelector('header').offsetHeight - 24
  const f = Math.min(aw / W, Math.max(ah, 200) / H)
  setZoom(f >= 1 ? Math.min(Math.floor(f), 32) : f)
}
$('zin').onclick = () => setZoom(zoom < 1 ? 1 / Math.max(1, Math.floor(1 / zoom) - 1) : Math.floor(zoom) + 1)
$('zout').onclick = () => setZoom(zoom > 1 ? Math.ceil(zoom) - 1 : 1 / (Math.round(1 / zoom) + 1))
$('fit').onclick = () => data && fit()

$('copy').onclick = async () => {
  const t = fmt(clicked)
  try { await navigator.clipboard.writeText(t) } catch (e) {
    const ta = Object.assign(document.createElement('textarea'), { value: t })
    document.body.append(ta); ta.select(); document.execCommand('copy'); ta.remove()
  }
  $('copy').textContent = 'Copied'; setTimeout(() => $('copy').textContent = 'Copy', 1000)
}

for (const f of [$('file'), $('file2')]) f.onchange = () => { load(f.files[0]); f.value = '' }
document.addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { load(it.getAsFile()); e.preventDefault(); return }
})
const main = $('main')
main.addEventListener('dragover', e => { e.preventDefault(); main.classList.add('over'); $('drop').classList.add('over') })
main.addEventListener('dragleave', () => { main.classList.remove('over'); $('drop').classList.remove('over') })
main.addEventListener('drop', e => {
  e.preventDefault(); main.classList.remove('over'); $('drop').classList.remove('over')
  load([...e.dataTransfer.files].find(f => f.type.startsWith('image/')))
})
</script>
</body>
</html>
